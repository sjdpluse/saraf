name: Test currency quotes

on:
  push:
    paths:
      - 'config.py'
      - 'handlers/currency.py'
      - 'handlers/compare.py'
      - 'services/currency_service.py'
      - 'services/local_market_service.py'
      - 'services/rate_engine.py'
      - 'services/spread_service.py'
      - 'services/converter_service.py'
      - 'services/facebook_service.py'
      - 'tests/test_currency_quote_units.py'
      - '.github/workflows/test-currency-quotes.yml'
  pull_request:
    paths:
      - 'config.py'
      - 'handlers/currency.py'
      - 'handlers/compare.py'
      - 'services/currency_service.py'
      - 'services/local_market_service.py'
      - 'services/rate_engine.py'
      - 'services/spread_service.py'
      - 'services/converter_service.py'
      - 'services/facebook_service.py'
      - 'tests/test_currency_quote_units.py'
      - '.github/workflows/test-currency-quotes.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile affected modules
        run: |
          python -m py_compile \
            config.py \
            handlers/currency.py \
            handlers/compare.py \
            services/currency_service.py \
            services/local_market_service.py \
            services/rate_engine.py \
            services/spread_service.py \
            services/converter_service.py \
            services/facebook_service.py \
            tests/test_currency_quote_units.py
      - name: Run currency unit regressions
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_currency_quote_units.py' -v
