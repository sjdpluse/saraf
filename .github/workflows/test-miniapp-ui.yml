name: Test miniapp UI
on:
  push:
    paths:
      - 'webapp/**'
      - 'services/market_snapshot.py'
      - 'tests/test_market_snapshot.py'
      - 'api.py'
      - '.github/workflows/test-miniapp-ui.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - 'services/market_snapshot.py'
      - 'tests/test_market_snapshot.py'
      - 'api.py'
      - '.github/workflows/test-miniapp-ui.yml'
jobs:
  build-and-market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build miniapp and test market display
        working-directory: webapp
        run: |
          npm ci
          node --test tests/market.test.js
          npm run build
      - name: Test market endpoint
        run: |
          pip install httpx==0.27.2 fastapi==0.115.5
          python tests/test_market_snapshot.py
