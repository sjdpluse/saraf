name: Audit original Saraf remaining private Meta migration config (READ ONLY)
on:
  push:
    branches: [migration/telegram-native-serverless-poc]
    paths:
      - .github/workflows/saraf-original-social-secret-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  only-secret-names:
    runs-on: ubuntu-latest
    environment: saraf-original-production
    env:
      SUPABASE_KEY: ${{ secrets.SARAF_ORIGINAL_SUPABASE_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.SARAF_ORIGINAL_FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.SARAF_ORIGINAL_FACEBOOK_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.SARAF_ORIGINAL_INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      INSTAGRAM_USER_ACCESS_TOKEN: ${{ secrets.SARAF_ORIGINAL_INSTAGRAM_USER_ACCESS_TOKEN }}
      FACEBOOK_APP_SECRET: ${{ secrets.SARAF_ORIGINAL_FACEBOOK_APP_SECRET }}
      INSTAGRAM_APP_SECRET: ${{ secrets.SARAF_ORIGINAL_INSTAGRAM_APP_SECRET }}
      OPENROUTER_API_KEY: ${{ secrets.SARAF_ORIGINAL_OPENROUTER_API_KEY }}
      SOCIAL_MANUAL_ON: ${{ secrets.SARAF_ORIGINAL_SOCIAL_PUBLISH_ENABLED }}
      SOCIAL_AUTO_ON: ${{ secrets.SARAF_ORIGINAL_SOCIAL_AUTOMATION_ENABLED }}
      META_WORKER_ON: ${{ secrets.SARAF_ORIGINAL_META_WORKER_ENABLED }}
      CUTOVER_ON: ${{ secrets.SARAF_ORIGINAL_CUTOVER_APPROVED }}
    steps:
      - name: Check presence only, no token values, no API calls or posting
        shell: bash
        run: |
          set -euo pipefail
          for key in SUPABASE_KEY FACEBOOK_PAGE_ID FACEBOOK_PAGE_ACCESS_TOKEN INSTAGRAM_BUSINESS_ACCOUNT_ID INSTAGRAM_USER_ACCESS_TOKEN FACEBOOK_APP_SECRET INSTAGRAM_APP_SECRET OPENROUTER_API_KEY; do
            if [[ -n "${!key}" ]]; then echo "CONFIGURED_$key"; else echo "MISSING_$key"; fi
          done
          for key in SOCIAL_MANUAL_ON SOCIAL_AUTO_ON META_WORKER_ON CUTOVER_ON; do
            if [[ "${!key}" == true ]]; then echo "ENABLED_$key"; else echo "DISABLED_$key"; fi
          done
          echo "AUDIT_COMPLETE_NO_META_CALLS"
