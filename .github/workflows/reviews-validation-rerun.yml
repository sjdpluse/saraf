name: Reviews validation rerun

on:
  push:
    branches: [feat/reviews-and-order-tracking-rules]
    paths:
      - '.github/workflows/reviews-validation-rerun.yml'

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reviews-and-order-tracking-rules
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_reviews_feature.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Mini App
        working-directory: webapp
        run: npm ci && npm run build
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q api.py bot.py config.py keyboards.py services
      - name: Validate reviews API and route installation
        env:
          BOT_TOKEN: test-token-for-ci-only
          ADMIN_CHAT_IDS: '123'
        run: |
          python - <<'PY'
          from services import reviews_api_extension as reviews
          assert reviews._clean_body('  نظر   خوب  ') == 'نظر خوب'
          assert reviews._is_admin({'id': 123}) is True
          assert reviews._is_admin({'id': 456}) is False
          assert reviews._public_review({'id': 1, 'display_name': 'کاربر', 'body': 'عالی'})['body'] == 'عالی'
          import api
          paths = {route.path for route in api.app.routes}
          assert '/api/reviews' in paths
          assert '/api/reviews/{review_id}/reply' in paths
          print('reviews smoke validation passed')
          PY
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp services supabase
          git diff --cached --quiet && exit 0
          git commit -m "Add Mini App reviews and pending-only order tracking"
          git push origin HEAD:feat/reviews-and-order-tracking-rules
