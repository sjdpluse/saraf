name: Saraf old Railway-era combined scheduled jobs (retired; no duplicate posts)
# Inert after original history and Meta publishing were separated into
# independently gated and pinned Railway-free schedules.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Original Saraf operations moved to separate guarded workflows
        run: |
          echo "This legacy scheduler is intentionally disabled to avoid duplicate posts."
          echo "Rate history: saraf-original-market-history.yml"
          echo "Facebook/Instagram: saraf-original-social-railway-free.yml"
          echo "Meta webhooks: saraf-original-meta-worker.yml"
