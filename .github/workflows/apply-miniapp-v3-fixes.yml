name: Apply Mini App v3 fixes

on:
  push:
    branches: [fix/miniapp-orders-download-cache-v3]
    paths:
      - '.github/scripts/apply_miniapp_v3_fixes.py'
      - '.github/scripts/trigger_miniapp_v3.txt'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miniapp-orders-download-cache-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply code changes
        run: python .github/scripts/apply_miniapp_v3_fixes.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Mini App
        working-directory: webapp
        run: npm ci && npm run build
      - name: Compile Python
        run: python -m compileall -q api.py bot.py config.py keyboards.py services
      - name: Validate pass token and renderer import
        run: |
          python - <<'PY'
          import asyncio
          from services import stablecoin_api_extension as ext
          from services import in_person_pass_service as pass_service
          token = ext._issue_pass_token('buy', 'USDT', '1234')
          assert ext._verify_pass_token(token)['code'] == '1234'
          async def main():
              original = pass_service._asset_logo
              async def no_logo(asset): return None
              pass_service._asset_logo = no_logo
              try:
                  data = await pass_service.generate_in_person_pass('buy', 'USDT', '1234')
                  assert data.startswith(b'\x89PNG') and len(data) > 1000
              finally:
                  pass_service._asset_logo = original
          asyncio.run(main())
          PY
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp services api.py bot.py config.py keyboards.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix Mini App cache, downloads, order tracking and visit cards"
          git push origin HEAD:fix/miniapp-orders-download-cache-v3
