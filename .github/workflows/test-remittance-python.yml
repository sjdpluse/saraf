name: Test remittance Python

on:
  push:
    paths:
      - 'services/remittance_*.py'
      - 'remittance_watcher.py'
      - 'api_remittance.py'
      - 'admin_bot_remittance.py'
      - 'webapp/src/pages/Remittance.jsx'
      - 'webapp/src/components/Network*.jsx'
      - 'webapp/src/lib/api.js'
      - 'webapp/src/remittance.css'
      - 'tests/test_remittance_registry.py'
      - '.github/workflows/test-remittance-python.yml'
  pull_request:
    paths:
      - 'services/remittance_*.py'
      - 'remittance_watcher.py'
      - 'api_remittance.py'
      - 'admin_bot_remittance.py'
      - 'webapp/src/pages/Remittance.jsx'
      - 'webapp/src/components/Network*.jsx'
      - 'webapp/src/lib/api.js'
      - 'webapp/src/remittance.css'
      - 'tests/test_remittance_registry.py'
      - '.github/workflows/test-remittance-python.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile remittance modules
        run: |
          python -m py_compile \
            services/remittance_service.py \
            services/remittance_api_router.py \
            services/remittance_admin.py \
            services/remittance_wallet_config.py \
            services/remittance_asset_registry.py \
            services/remittance_price_service.py \
            services/remittance_v2.py \
            services/remittance_chain_config.py \
            services/remittance_chain_verifier.py \
            remittance_watcher.py \
            api_remittance.py \
            admin_bot_remittance.py
      - name: Test asset registry
        run: PYTHONPATH=. python tests/test_remittance_registry.py
      - name: Build Mini App
        working-directory: webapp
        run: npm ci && npm run build
