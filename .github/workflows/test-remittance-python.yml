name: Test remittance Python

on:
  push:
    branches:
      - feature/remittance-assets-networks-v2
    paths:
      - 'services/remittance_*.py'
      - 'api_remittance.py'
      - 'admin_bot_remittance.py'
      - 'tests/test_remittance_registry.py'
      - '.github/workflows/test-remittance-python.yml'
  pull_request:
    paths:
      - 'services/remittance_*.py'
      - 'api_remittance.py'
      - 'admin_bot_remittance.py'
      - 'tests/test_remittance_registry.py'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile remittance modules
        run: |
          python -m py_compile \
            services/remittance_service.py \
            services/remittance_api_router.py \
            services/remittance_admin.py \
            services/remittance_wallet_config.py \
            services/remittance_asset_registry.py \
            services/remittance_price_service.py \
            services/remittance_v2.py \
            api_remittance.py \
            admin_bot_remittance.py
      - name: Test asset registry
        run: python tests/test_remittance_registry.py
