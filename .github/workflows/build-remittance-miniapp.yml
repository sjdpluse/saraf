name: Build remittance Mini App

on:
  push:
    branches:
      - feature/international-remittance-v1
    paths:
      - 'webapp/src/**'
      - 'webapp/package.json'
      - 'webapp/package-lock.json'
      - '.github/workflows/build-remittance-miniapp.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip miniapp build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/international-remittance-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: webapp
        run: npm ci
      - name: Build Mini App
        working-directory: webapp
        run: npm run build
      - name: Commit built assets
        run: |
          if git diff --quiet -- webapp/dist; then
            echo 'No dist changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f webapp/dist
          git commit -m 'Build remittance Mini App [skip miniapp build]'
          git push origin HEAD:feature/international-remittance-v1
