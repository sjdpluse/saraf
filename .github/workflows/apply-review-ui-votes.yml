name: Apply review UI votes

on:
  push:
    branches: [fix/afghan-dates-review-ui-votes]
    paths:
      - '.github/scripts/apply_review_ui_votes.py'
      - '.github/scripts/trigger_review_ui_votes.txt'

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/afghan-dates-review-ui-votes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_review_ui_votes.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Mini App
        working-directory: webapp
        run: npm ci && npm run build
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q api.py bot.py config.py keyboards.py services
      - name: Validate reviews vote route
        env:
          BOT_TOKEN: test-token-for-ci-only
        run: |
          python - <<'PY'
          import api
          paths = {route.path for route in api.app.routes}
          assert '/api/reviews' in paths
          assert '/api/reviews/{review_id}/vote' in paths
          assert '/api/reviews/{review_id}/reply' in paths
          print('reviews routes ok')
          PY
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp services supabase
          git diff --cached --quiet && exit 0
          git commit -m "Refine reviews UI with Afghan dates and voting"
          git push origin HEAD:fix/afghan-dates-review-ui-votes
