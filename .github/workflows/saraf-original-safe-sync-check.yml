name: Original Saraf safe Serverless revision sync — dry-run CI
on:
  push:
    branches:
      - migration/telegram-native-serverless-poc
    paths:
      - scripts/publish_original_saraf_serverless.mjs
      - scripts/prepare_saraf_original_release.mjs
      - serverless-poc/tests/original_tgcloud_revision_sync.test.js
      - .github/workflows/saraf-original-safe-sync-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-original-sync-code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check original bot release scripts (never publish here)
        run: |
          node --check scripts/publish_original_saraf_serverless.mjs
          node --check scripts/prepare_saraf_original_release.mjs
      - name: Prove fetch → inspect → targeted upload → webhook sync preserves existing remote modules
        run: node --test serverless-poc/tests/original_tgcloud_revision_sync.test.js
      - name: Run bot callback regressions before any production release
        run: node --test serverless-poc/tests/*.test.js
      - name: No Telegram deployment performed
        run: echo "The original production bot and Railway webhook have not been changed."
  inspect-original-existing-cloud-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Confirm the intended original BotFather application (no token printed)
        shell: bash
        run: |
          test "${TGCLOUD_TOKEN:-}" != ""
          [[ "$TGCLOUD_TOKEN" == app8533795882:* ]] || exit 1
      - name: Build the original React static bundle (no publish)
        working-directory: webapp
        run: |
          npm ci
          npm run build:telegram-original-full
      - name: Prepare exact targeted module manifest for original app
        run: node scripts/prepare_saraf_original_release.mjs
      - name: Install Telegram Serverless CLI 0.2.0 in disposable build directory
        working-directory: serverless-poc/.release-original
        run: npm install --no-save --ignore-scripts @tgcloud/cli@0.2.0
      - name: READ ONLY — fetch existing 11-module Telegram revision, no push/force
        working-directory: serverless-poc/.release-original
        run: npx --no-install tgcloud fetch
      - name: READ ONLY — show local-vs-deployed status, preserve remote modules
        working-directory: serverless-poc/.release-original
        run: npx --no-install tgcloud status
      - name: Confirm no deployed bot, webhook or database changed
        run: echo "Revision fetched only. No tgcloud push, migrate, or webhook sync was executed."
