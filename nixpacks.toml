[phases.setup]
nixPkgs = [
    "chromium",
    "nss",
    "nspr",
    "atk",
    "at-spi2-atk",
    "at-spi2-core",
    "gtk3",
    "pango",
    "cairo",
    "gdk-pixbuf",
    "libxkbcommon",
    "libdrm",
    "mesa"
]

[phases.install]
# نصب requirements + نصب Chromium در مسیر persistشده /app
cmds = [
    "pip install -r requirements.txt",
    "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright-browsers playwright install --with-deps chromium"
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.playwright-browsers"
PYTHONUNBUFFERED = "1"