[phases.setup]
nixPkgs = [
    "chromium",
    "nss",
    "nspr",
    "atk",
    "at-spi2-atk",
    "at-spi2-core",
    "gtk3",
    "pango",
    "cairo",
    "gdk-pixbuf",
    "libxkbcommon",
    "libdrm",
    "mesa",
    "alsa-lib",
    "cups",
    "dbus",
    "expat",
    "xorg.libX11",
    "xorg.libXcomposite",
    "xorg.libXdamage",
    "xorg.libXext",
    "xorg.libXfixes",
    "xorg.libXrandr",
    "xorg.libxshmfence",
    "libglvnd"
]

[phases.install]
cmds = [
    "pip install -r requirements.txt"
]

[variables]
PYTHONUNBUFFERED = "1"